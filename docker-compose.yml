services:
  validator1:
    image: hyperledger/besu:latest
    container_name: validator1
    cap_add: [NET_ADMIN]
    command:
      - --data-path=/var/lib/besu/data
      - --genesis-file=/config/genesis.json

      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,IBFT,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=all

      - --p2p-interface=0.0.0.0
      - --p2p-port=30303
      - --nat-method=NONE
      - --logging=INFO
    volumes:
      - ./config/genesis.json:/config/genesis.json:ro
      - ./nodes/validator1/data:/var/lib/besu/data
    ports:
      - "8545:8545"
      - "30303:30303"

  validator2:
    image: hyperledger/besu:latest
    container_name: validator2
    cap_add: [NET_ADMIN]
    depends_on: [validator1]
    command:
      - --data-path=/var/lib/besu/data
      - --genesis-file=/config/genesis.json

      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,IBFT,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=all

      - --p2p-interface=0.0.0.0
      - --p2p-port=30303
      - --nat-method=NONE

      - --bootnodes=${BOOTNODE_ENODE}
      - --logging=INFO
    volumes:
      - ./config/genesis.json:/config/genesis.json:ro
      - ./nodes/validator2/data:/var/lib/besu/data
    ports:
      - "8546:8545"
      - "30304:30303"

  validator3:
    image: hyperledger/besu:latest
    container_name: validator3
    cap_add: [NET_ADMIN]
    depends_on: [validator1]
    command:
      - --data-path=/var/lib/besu/data
      - --genesis-file=/config/genesis.json

      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,IBFT,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=all

      - --p2p-interface=0.0.0.0
      - --p2p-port=30303
      - --nat-method=NONE

      - --bootnodes=${BOOTNODE_ENODE}
      - --logging=INFO
    volumes:
      - ./config/genesis.json:/config/genesis.json:ro
      - ./nodes/validator3/data:/var/lib/besu/data
    ports:
      - "8547:8545"
      - "30305:30303"

  validator4:
    image: hyperledger/besu:latest
    container_name: validator4
    cap_add: [NET_ADMIN]
    depends_on: [validator1]
    command:
      - --data-path=/var/lib/besu/data
      - --genesis-file=/config/genesis.json

      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,IBFT,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=all

      - --p2p-interface=0.0.0.0
      - --p2p-port=30303
      - --nat-method=NONE

      - --bootnodes=${BOOTNODE_ENODE}
      - --logging=INFO
    volumes:
      - ./config/genesis.json:/config/genesis.json:ro
      - ./nodes/validator4/data:/var/lib/besu/data
    ports:
